# Lunar Design enquiry Worker
# Receives website enquiries (via the Pages "ENQUIRY" service binding) and emails
# them to the studio inboxes using Cloudflare Email Routing.
# Deployed by Cloudflare Workers Builds from this folder (root: workers/enquiry).

name = "lunar-ds-enquiry"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Not publicly reachable - only the Pages site calls it, through the service binding.
workers_dev = false
preview_urls = false

[vars]
NOTIFY_TO = "stephenrae.lunardesigns@gmail.com,lauren.lunardesign@gmail.com"
FROM_ADDRESS = "enquiries@lunar-ds.com"
FROM_NAME = "Lunar Design Website"

# Free plan: can only send to destination addresses verified in Email Routing.
[[send_email]]
name = "EMAIL"
allowed_destination_addresses = [
  "stephenrae.lunardesigns@gmail.com",
  "lauren.lunardesign@gmail.com",
]

[observability]
enabled = true
